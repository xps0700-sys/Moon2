name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Android SDK
        shell: bash
        run: |
          set -eux

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_HOME"

          echo "Android SDK:"
          ls "$ANDROID_HOME"

          echo "Installed Android platforms:"
          ls "$ANDROID_HOME/platforms"

          echo "Installed build tools:"
          ls "$ANDROID_HOME/build-tools"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Find FIXED ZIP
        shell: bash
        run: |
          set -eux

          echo "Repository files:"
          ls -lah

          ZIP=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname "*FIXED*.zip" \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: FIXED ZIP NOT FOUND"
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP"

          echo "ZIP_FILE=$ZIP" >> "$GITHUB_ENV"

      - name: Extract Android project
        shell: bash
        run: |
          set -eux

          rm -rf "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/project"

          echo "Extracted project:"
          find "$GITHUB_WORKSPACE/project" -maxdepth 3 -type f | sort

      - name: Locate Gradle project
        shell: bash
        run: |
          set -eux

          SETTINGS=$(find "$GITHUB_WORKSPACE/project" \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts was not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          test -f "$PROJECT_DIR/app/build.gradle.kts"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare Gradle
        shell: bash
        run: |
          set -eux

          chmod +x "$PROJECT_DIR/gradlew"

          ls -lah "$PROJECT_DIR/gradlew"

      - name: Build APK
        shell: bash
        run: |
          set -eux

          cd "$PROJECT_DIR"

          echo "Current directory:"
          pwd

          echo "Project:"
          ls -lah

          echo "Starting Gradle build..."

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Find APK
        if: always()
        shell: bash
        run: |
          echo "APK SEARCH"

          find "$GITHUB_WORKSPACE/project" \
            -type f \
            -name "*.apk" \
            -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppRecoveryPro-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
