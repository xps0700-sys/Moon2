name: Build APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Locate FIXED ZIP
        shell: bash
        run: |
          echo "Repository contents:"
          ls -la

          ZIP=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname '*FIXED*.zip' \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: FIXED ZIP was not found."
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP"

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          set -eux

          rm -rf "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/project"

          echo "Extracted files:"
          find "$GITHUB_WORKSPACE/project" -maxdepth 2 -type f | sort

      - name: Detect Android project
        shell: bash
        run: |
          set -eux

          SETTINGS=$(find "$GITHUB_WORKSPACE/project" \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project settings.gradle was not found."
            find "$GITHUB_WORKSPACE/project" -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          test -f "$PROJECT_DIR/app/build.gradle.kts" || \
          test -f "$PROJECT_DIR/app/build.gradle"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Verify project
        shell: bash
        run: |
          set -eux

          cd "$PROJECT_DIR"

          echo "Current directory:"
          pwd

          echo "Project files:"
          ls -la

          echo "Gradle version:"
          gradle --version

      - name: Build APK
        shell: bash
        run: |
          set -eux

          cd "$PROJECT_DIR"

          echo "Building APK..."
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Find APK
        if: always()
        shell: bash
        run: |
          echo "Searching for APK..."
          find "$GITHUB_WORKSPACE/project" \
            -type f \
            -name "*.apk" \
            -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppRecoveryPro-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
