name: Build APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Find the corrected ZIP
        id: find_zip
        shell: bash
        run: |
          ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*FIXED*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "ERROR: No *FIXED*.zip file was found in the repository root."
            echo "Files found:"
            ls -la
            exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Using: $ZIP"

      - name: Extract Android project
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/project"
          unzip -q "${{ steps.find_zip.outputs.zip }}" -d "$GITHUB_WORKSPACE/project"

          if [ ! -f "$GITHUB_WORKSPACE/project/settings.gradle.kts" ] && [ ! -f "$GITHUB_WORKSPACE/project/settings.gradle" ]; then
            ROOT_DIR="$(find "$GITHUB_WORKSPACE/project" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            if [ -n "$ROOT_DIR" ] && { [ -f "$ROOT_DIR/settings.gradle.kts" ] || [ -f "$ROOT_DIR/settings.gradle" ]; }; then
              cp -a "$ROOT_DIR"/. "$GITHUB_WORKSPACE/project"/
            fi
          fi

          echo "Project files:"
          ls -la "$GITHUB_WORKSPACE/project"

          test -f "$GITHUB_WORKSPACE/project/settings.gradle.kts" || test -f "$GITHUB_WORKSPACE/project/settings.gradle"
          test -f "$GITHUB_WORKSPACE/project/app/build.gradle.kts" || test -f "$GITHUB_WORKSPACE/project/app/build.gradle"

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Verify Gradle
        working-directory: project
        run: gradle --version

      - name: Build Debug APK
        working-directory: project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Show generated APK
        if: always()
        working-directory: project
        run: |
          find app/build/outputs -type f -name "*.apk" -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppRecoveryPro-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
